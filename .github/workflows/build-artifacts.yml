name: Build Windows EXE and Linux AppImage

on:
  push:
    branches:
      - main

env:
  PYTHON_VERSION: "3.11"
  APP_NAME: "BlockMeshAuto"
  MAIN_SCRIPT: "main.py"   # CHANGE if your entry file is different

jobs:

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          }
          pip install pyinstaller

      - name: Build EXE
        shell: powershell
        run: |
          pyinstaller --onefile --clean --name $env:APP_NAME $env:MAIN_SCRIPT

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows
          path: dist/*.exe

      - name: Clean Windows build files
        shell: powershell
        run: |
          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item *.spec -Force -ErrorAction SilentlyContinue


  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller

      - name: Build Linux Binary
        run: |
          pyinstaller --onefile --clean --name "$APP_NAME" "$MAIN_SCRIPT"
          ls -la dist

      - name: Smoke Test Binary
        run: |
          chmod +x "dist/$APP_NAME"
          ./dist/"$APP_NAME" --help || true

      - name: Prepare AppDir (create root desktop file required by appimagetool)
        run: |
          mkdir -p AppDir/usr/bin
          cp "dist/$APP_NAME" "AppDir/usr/bin/"

          # Root .desktop file is REQUIRED at AppDir/<app>.desktop
          mkdir -p AppDir/usr/share/applications
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            "Name=$APP_NAME" \
            "Exec=usr/bin/$APP_NAME" \
            "Icon=$APP_NAME" \
            'Categories=Utility;' \
            > "AppDir/$APP_NAME.desktop"
          chmod 0644 "AppDir/$APP_NAME.desktop"

          # copy into standard location too
          cp "AppDir/$APP_NAME.desktop" "AppDir/usr/share/applications/$APP_NAME.desktop"

          # Optionally copy icon(s) if you have one in repo at assets/icon.png
          # mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          # cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/"$APP_NAME".png

          echo "AppDir layout (preview):"
          find AppDir -maxdepth 3 -type f -print || true

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage
          echo "appimagetool size:"
          ls -lh appimagetool.AppImage

      - name: Build AppImage (FUSE safe: extract then run)
        run: |
          ./appimagetool.AppImage --appimage-extract
          ./squashfs-root/AppRun AppDir
          echo "Produced files:"
          ls -la *.AppImage || true

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux
          path: "*.AppImage"

      - name: Clean Linux build files
        run: |
          rm -rf build dist *.spec AppDir appimagetool.AppImage squashfs-root || true
