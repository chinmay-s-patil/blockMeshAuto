name: Build Windows .exe and Linux AppImage

# Runs on every push (change to tags or branches if you prefer)
on:
  push:
    branches: ["main"]

env:
  PYTHON_VERSION: '3.11'
  APP_NAME: 'BlockMeshAuto'
  MAIN_SCRIPT: 'main.py'   # change if your entrypoint has a different name

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (if requirements.txt present)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller

      - name: Build Windows .exe (PyInstaller)
        run: |
          pyinstaller --onefile --clean --name "${{ env.APP_NAME }}" "${{ env.MAIN_SCRIPT }}"
          # On Windows the result will be in dist\BlockMeshAuto.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows
          path: dist/*.exe

      - name: Clean windows runner build files
        run: |
          rd /s /q build || exit 0
          del /f /q *.spec || exit 0
          rd /s /q dist || exit 0

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create venv & install deps
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller

      - name: Build Linux single-file binary (PyInstaller)
        run: |
          source venv/bin/activate
          pyinstaller --onefile --clean --name "${{ env.APP_NAME }}" "${{ env.MAIN_SCRIPT }}" \
            --distpath dist --workpath build
          ls -la dist

      - name: Smoke test Linux binary
        run: |
          ./dist/${{ env.APP_NAME }} --help || echo "help failed - trying --version"
          ./dist/${{ env.APP_NAME }} --version || echo "version not supported; binary executed exit=$?"

      - name: Prepare AppDir for AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/${{ env.APP_NAME }} AppDir/usr/bin/${{ env.APP_NAME }}
          # Desktop entry (simple). Put a better one in repo if you want.
          mkdir -p AppDir/usr/share/applications
          cat > AppDir/usr/share/applications/${{ env.APP_NAME }}.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=${{ env.APP_NAME }}
          Exec=${{ env.APP_NAME }}
          Icon=${{ env.APP_NAME }}
          Categories=Utility;
          EOF
          # optionally add an icon in repo and copy it to AppDir/usr/share/icons/hicolor/256x256/apps/

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage

      - name: Build AppImage
        run: |
          # appimagetool will create an AppImage from AppDir
          ./appimagetool.AppImage AppDir || ( echo "appimagetool failed" && ls -la && exit 1 )
          # produced file looks like ${APP_NAME}-x86_64.AppImage

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux
          path: *.AppImage

      - name: Clean linux runner build files
        run: |
          rm -rf build dist *.spec AppDir appimagetool.AppImage venv || true
