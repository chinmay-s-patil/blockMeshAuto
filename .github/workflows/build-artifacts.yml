name: Build Windows EXE and Linux AppImage

on:
  push:
    branches:
      - main

env:
  PYTHON_VERSION: "3.11"
  APP_NAME: "BlockMeshAuto"
  MAIN_SCRIPT: "main.py"   # CHANGE if needed

jobs:

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          }
          pip install pyinstaller

      - name: Build EXE
        shell: powershell
        run: |
          pyinstaller --onefile --clean --name $env:APP_NAME $env:MAIN_SCRIPT

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows
          path: dist/*.exe

      - name: Clean Windows build files
        shell: powershell
        run: |
          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item *.spec -Force -ErrorAction SilentlyContinue


  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller

      - name: Build Linux Binary
        run: |
          pyinstaller --onefile --clean --name $APP_NAME $MAIN_SCRIPT
          ls -la dist

      - name: Smoke Test Binary
        run: |
          chmod +x dist/$APP_NAME
          ./dist/$APP_NAME --help || true

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/$APP_NAME AppDir/usr/bin/

          mkdir -p AppDir/usr/share/applications
          echo "[Desktop Entry]" > AppDir/usr/share/applications/$APP_NAME.desktop
          echo "Type=Application" >> AppDir/usr/share/applications/$APP_NAME.desktop
          echo "Name=$APP_NAME" >> AppDir/usr/share/applications/$APP_NAME.desktop
          echo "Exec=$APP_NAME" >> AppDir/usr/share/applications/$APP_NAME.desktop
          echo "Categories=Utility;" >> AppDir/usr/share/applications/$APP_NAME.desktop

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage

      - name: Build AppImage
        run: |
          ./appimagetool.AppImage AppDir
          ls -la *.AppImage

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux
          path: "*.AppImage"

      - name: Clean Linux build files
        run: |
          rm -rf build dist *.spec AppDir appimagetool.AppImage
